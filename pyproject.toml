[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "portpilot"
version = "0.1.0"
description = "Evidence-backed Windows Arm porting workflow"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.scripts]
portpilot = "portpilot.cli:main"

[tool.setuptools.packages.find]
include = ["portpilot*"]
