name: PocketSphinx Windows Arm64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pocketsphinx-arm64.yml"
      - "patches/pocketsphinx/**"

permissions:
  contents: read

jobs:
  native-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 45

    steps:
      - name: Check out PortPilot
        uses: actions/checkout@v4

      - name: Install native test dependencies
        shell: pwsh
        run: |
          choco install sox.portable strawberryperl -y --no-progress
          "C:\Program Files\Git\usr\bin" | Out-File -Append $env:GITHUB_PATH
          "C:\Strawberry\perl\bin" | Out-File -Append $env:GITHUB_PATH

      - name: Verify native test dependencies
        shell: pwsh
        run: |
          Get-Command bash, diff, perl, sox
          perl -MPod::Usage -e 1

      - name: Check out pinned PocketSphinx
        shell: pwsh
        run: |
          git clone --no-checkout https://github.com/cmusphinx/pocketsphinx.git pocketsphinx
          git -C pocketsphinx config core.autocrlf false
          git -C pocketsphinx checkout 511126b492dcb267cf30d49d631946d7b61a9530
          $patch = Resolve-Path "patches/pocketsphinx/0001-msvc-test-portability.patch"
          git -C pocketsphinx apply $patch
          git -C pocketsphinx diff --check
          git -C pocketsphinx diff --stat
          if (-not (Select-String -Path pocketsphinx/test/unit/test_config.c -Pattern "_putenv_s")) {
            throw "PocketSphinx portability patch was not applied"
          }
          if (-not (Select-String -Path pocketsphinx/CMakeLists.txt -Pattern "CMAKE_RUNTIME_OUTPUT_DIRECTORY_.*CONFIG_UPPER")) {
            throw "PocketSphinx multi-config output patch was not applied"
          }

      - name: Record native environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE" |
            Tee-Object evidence/environment.txt
          Get-CimInstance Win32_OperatingSystem |
            Format-List Caption,Version,OSArchitecture |
            Out-File -Append evidence/environment.txt
          cmake --version | Out-File -Append evidence/environment.txt

      - name: Configure native Arm64
        shell: pwsh
        run: cmake -S pocketsphinx -B pocketsphinx/build -A ARM64 -DBUILD_TESTING=ON

      - name: Build native Arm64
        shell: pwsh
        run: cmake --build pocketsphinx/build --config Release --parallel

      - name: Build and run C tests
        id: c_tests
        continue-on-error: true
        shell: pwsh
        run: cmake --build pocketsphinx/build --config Release --target check --parallel

      - name: Verify PE architecture
        shell: pwsh
        run: |
          $binary = "pocketsphinx/build/pocketsphinx.exe"
          $stream = [System.IO.File]::OpenRead($binary)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset
            $signature = $reader.ReadUInt32()
            $machine = $reader.ReadUInt16()
          }
          finally {
            $stream.Dispose()
          }
          "PE=0x{0:X8} Machine=0x{1:X4}" -f $signature,$machine |
            Tee-Object evidence/pe-architecture.txt
          if ($signature -ne 0x4550 -or $machine -ne 0xAA64) {
            throw "Expected an ARM64 PE image"
          }

      - name: Run deterministic recognition
        shell: pwsh
        run: |
          $root = Resolve-Path pocketsphinx
          $exe = "$root/build/pocketsphinx.exe"
          & $exe `
            -hmm "$root/model/en-us/en-us" `
            -lm "$root/model/en-us/en-us.lm.bin" `
            -dict "$root/model/en-us/cmudict-en-us.dict" `
            single "$root/test/data/librivox/sense_and_sensibility_01_austen_64kb-0870.wav" |
            Tee-Object evidence/recognition.json
          if ($LASTEXITCODE -ne 0) {
            throw "Recognition failed with exit code $LASTEXITCODE"
          }

      - name: Enforce C test gate
        if: always()
        shell: pwsh
        env:
          C_TEST_OUTCOME: ${{ steps.c_tests.outcome }}
        run: |
          $expectedWindowsFailures = @(
            "test-main.sh",
            "test_vad",
            "test_lm_read",
            "test_lm_score",
            "test_lm_add",
            "test_lm_class",
            "test_lm_set",
            "test_lm_write",
            "test_fopen"
          )
          $failedLog = "pocketsphinx/build/Testing/Temporary/LastTestsFailed.log"
          $failed = if (Test-Path $failedLog) {
            @(Get-Content $failedLog | ForEach-Object { ($_ -split ":", 2)[1] })
          } else {
            @()
          }
          $unexpected = @($failed | Where-Object { $_ -notin $expectedWindowsFailures })
          @(
            "CTest outcome: $env:C_TEST_OUTCOME"
            "Failed tests: $($failed.Count)"
            "Unexpected failures: $($unexpected.Count)"
            ""
            "Failures:"
            $failed
          ) | Set-Content evidence/ctest-summary.txt
          if ($unexpected.Count -ne 0) {
            throw "Unexpected native Arm64 CTest failures: $($unexpected -join ', ')"
          }

      - name: Set up native Arm64 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Build and audit native Arm64 Python wheel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force wheelhouse | Out-Null

          python -c "import platform, struct; print(f'Python machine: {platform.machine()}'); print(f'Pointer width: {struct.calcsize(""P"") * 8}')"
          python -m pip install --upgrade pip
          python -m pip wheel pocketsphinx --no-deps --wheel-dir wheelhouse

          $wheels = @(Get-ChildItem wheelhouse\pocketsphinx-*-win_arm64.whl)
          if ($wheels.Count -ne 1) {
            throw "Expected exactly one win_arm64 wheel, found $($wheels.Count)."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $extractDir = Join-Path $env:RUNNER_TEMP "pocketsphinx-wheel"
          [System.IO.Compression.ZipFile]::ExtractToDirectory($wheels[0].FullName, $extractDir)

          $nativeFiles = @(Get-ChildItem $extractDir -Recurse -File |
            Where-Object { $_.Extension -in ".pyd", ".dll" })
          if ($nativeFiles.Count -eq 0) {
            throw "The wheel contains no native extension or DLL."
          }

          $report = @("Wheel: $($wheels[0].Name)")
          foreach ($file in $nativeFiles) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            $relativePath = [System.IO.Path]::GetRelativePath($extractDir, $file.FullName)
            $report += "$relativePath Machine=0x$($machine.ToString('X4'))"
            if ($machine -ne 0xAA64) {
              throw "$relativePath is not native Arm64 (machine 0x$($machine.ToString('X4')))."
            }
          }
          $report | Tee-Object evidence\wheel-architecture.txt

      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketsphinx-windows-arm64-evidence
          path: |
            evidence/
            pocketsphinx/build/Testing/Temporary/
            wheelhouse/*.whl

  validate-arm64-wheel:
    name: Clean-install Arm64 wheel
    needs: native-arm64
    runs-on: windows-11-arm

    steps:
      - name: Check out PortPilot
        uses: actions/checkout@v4

      - name: Check out pinned PocketSphinx fixtures
        shell: pwsh
        run: |
          git clone --no-checkout https://github.com/cmusphinx/pocketsphinx.git pocketsphinx
          git -C pocketsphinx config core.autocrlf false
          git -C pocketsphinx checkout 511126b492dcb267cf30d49d631946d7b61a9530

      - name: Set up native Arm64 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Download Arm64 wheel
        uses: actions/download-artifact@v5
        with:
          name: pocketsphinx-windows-arm64-evidence
          path: validation-artifacts

      - name: Validate clean wheel installation and runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force evidence | Out-Null
          $wheels = @(Get-ChildItem validation-artifacts -Recurse -Filter "pocketsphinx-*-win_arm64.whl")
          if ($wheels.Count -ne 1) {
            throw "Expected exactly one win_arm64 wheel, found $($wheels.Count)."
          }

          python -m venv arm64-venv
          $venvPython = Resolve-Path arm64-venv\Scripts\python.exe
          & $venvPython -m pip install --upgrade pip
          & $venvPython -m pip install $wheels[0].FullName
          & $venvPython -m pip install pytest memory_profiler

          & $venvPython -c "import platform, pocketsphinx, struct; print(f'Python machine: {platform.machine()}'); print(f'Pointer width: {struct.calcsize(""P"") * 8}'); print(f'PocketSphinx module: {pocketsphinx.__file__}')"
          & $venvPython -m pytest pocketsphinx\cython\test -q -p no:cacheprovider |
            Tee-Object evidence\python-tests.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Python test suite failed with exit code $LASTEXITCODE."
          }

          @'
          from pathlib import Path
          from pocketsphinx import AudioFile

          audio = Path("pocketsphinx/test/data/goforward.raw")
          hypotheses = [str(phrase) for phrase in AudioFile(audio_file=str(audio))]
          print("\n".join(hypotheses))
          if hypotheses != ["go forward ten meters"]:
              raise SystemExit(f"Unexpected recognition result: {hypotheses!r}")
          '@ | & $venvPython - | Tee-Object evidence\python-recognition.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Installed-wheel recognition failed with exit code $LASTEXITCODE."
          }

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketsphinx-windows-arm64-runtime-evidence
          path: evidence/
